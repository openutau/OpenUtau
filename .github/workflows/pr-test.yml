on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    branches: [ master ]

jobs:
  pr-test:
    runs-on: ${{ matrix.os.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        os: 
          - runs-on: windows-latest
            arch: win-x64
          - runs-on: macos-latest
            arch: osx-arm64
          - runs-on: ubuntu-latest
            arch: linux-x64

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          8.0.x
          10.0.x

    - name: restore
      run: dotnet restore OpenUtau -r ${{ matrix.os.arch }}

    - name: test
      run: dotnet run --project OpenUtau.Test/OpenUtau.Test.csproj
      timeout-minutes: 30

    # Headless UI tests of the whole app. A separate process: launching the app changes
    # process-wide state that the tests above rely on.
    - name: ui test
      run: dotnet run --project OpenUtau.UiTest/OpenUtau.UiTest.csproj
      timeout-minutes: 15

    - name: upload ui screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-screenshots-${{ matrix.os.arch }}
        path: OpenUtau.UiTest/bin/**/ui-screenshots/
        if-no-files-found: ignore

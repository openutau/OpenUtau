    phonemes: [o, p, e, n, u, t, a, u]
  - grapheme: โอเพ่นอูตาอุ
    phonemes: [o, p, e, n, u, t, a, u]
  - grapheme: เดลต้า
    phonemes: [d, e, l, t, a]
  - grapheme: ปริ้นโมฟ
    phonemes: [p, r, i, n, m, o, f]
  - grapheme: ช้าง
    phonemes: [ch, a, g]
  - grapheme: ส้ม
    phonemes: [s, o, m]
  - grapheme: หมา
    phonemes: [ m, a]
  - grapheme: รัก
    phonemes: [r, a, k]
  - grapheme: แล้ว
    phonemes: [l, '@', w]
  - grapheme: เเล้ว
    phonemes: [l, '@', w]
  - grapheme: ยาว
    phonemes: [y, a, w]
  - grapheme: กิน
    phonemes: [k, i, n]
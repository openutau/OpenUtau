  - {from: [b, b], to: [B], where: inside}
  - {from: [d, d], to: [D], where: inside}
  - {from: [g, g], to: [G], where: inside}

  - {from: [s, s], to: [s], where: all}
  - {from: [f, f], to: [f], where: all}
  - {from: [z, z], to: [t, z], where: all}
